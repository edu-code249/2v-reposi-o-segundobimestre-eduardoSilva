<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="revision" content="auth-rb2a2-2v-leituras">
    <title>{% block title %}Controle de Leituras{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #243447;
            color: white;
            padding: 1rem 2rem;
        }

        nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        input, button {
            font: inherit;
            padding: 0.5rem;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        button, .button {
            background: #2563eb;
            border: 0;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .danger {
            background: #dc2626;
        }

        .muted {
            color: #666;
        }

        .flash {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Controle de Leituras</h1>
        <nav>
            <a href="{{ url_for('leituras.index') }}">Leituras</a>
            <a href="{{ url_for('leituras.nova_leitura') }}">Nova leitura</a>
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.registro') }}">Cadastro</a>
            <a href="{{ url_for('auth.logout') }}">Sair</a>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="flash">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
